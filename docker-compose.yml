version: "3.9"

services:
  dwh_pipeline:
    build:
      context: .
      dockerfile: dockerfile.dwh
    container_name: dwh_pipeline
    ports:
      - "3000:3000"
    image: crjobtechdev-asgzd9d0dwegegeb.azurecr.io/dwh_pipeline:latest  
    volumes:
      - ./duckdb_warehouse:/mnt/data

  dashboard:
    build:
      context: .
      dockerfile: dockerfile.dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    image: crjobtechdev-asgzd9d0dwegegeb.azurecr.io/dashboard:latest
    volumes:
      - ./duckdb_warehouse:/mnt/data
  
